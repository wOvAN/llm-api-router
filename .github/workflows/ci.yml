name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Format
        run: go fmt ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.0

      - name: Build
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          go build -ldflags "-X main.Version=${VERSION}" -o llm-api-router .

      - name: Test
        run: go test -v ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          docker build --build-arg VERSION=${VERSION} -t llm-api-router .

  publish:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/llm-api-router
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=sha-${GITHUB_SHA::7}
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          TAGS="-t $IMAGE:latest -t $IMAGE:$SHA_TAG"
          if [ "$IS_TAG" = "true" ]; then
            TAGS="-t $IMAGE:${GITHUB_REF#refs/tags/} -t $IMAGE:latest"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --build-arg VERSION=${VERSION} \
            $TAGS \
            .
